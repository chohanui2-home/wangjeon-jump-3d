<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>size harness</title>
<style>html,body{margin:0;background:#1f2230;font-family:system-ui,sans-serif}
#wrap{transform-origin:0 0;padding:0}
#lbl{color:#fff;font-size:11px;padding:4px 8px}
iframe{border:0;background:#fff;display:block}
</style></head>
<body>
<div id="lbl"></div>
<div id="wrap"><iframe id="f" src="./index.html"></iframe></div>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get('w'), 10) || 390;
var h = parseInt(q.get('h'), 10) || 844;
var f = document.getElementById('f');
f.width = w; f.height = h;
f.src = './index.html?v=' + Date.now();
var s = Math.min(1, (innerHeight - 34) / h, (innerWidth - 20) / w);
document.getElementById('wrap').style.transform = 'scale(' + s + ')';
document.getElementById('lbl').textContent = w + ' x ' + h + '  (scale ' + s.toFixed(3) + ')';
window.__errs = [];
f.addEventListener('load', function () {
  f.contentWindow.addEventListener('error', function (e) {
    window.__errs.push(String(e.message) + ' @' + e.lineno);
  });
});
</script>
</body></html>
